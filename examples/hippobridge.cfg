# HippoBridge Configuration File
# Configuration settings for the HippoBridge FHIR API gateway
#
# Copy this file to the project root and edit it:
#   cp examples/hippobridge.cfg hippobridge.cfg
# The project root's hippobridge.cfg is gitignored; this copy under
# examples/ is the tracked reference for every available option and its
# default value.

[server]
# Server configuration
# host: IP address to bind to (0.0.0.0 for all interfaces)
# port: Port number for the HTTP server
host = 0.0.0.0
port = 44660

[hipocrate]
# Hipocrate service configuration
# service_url: Base URL of the Hipocrate medical system
#              This should point to the root directory of your Hipocrate installation
service_url = http://127.0.0.1/hipocrate

[cache]
# Persistent SQLite cache for Hipocrate HTML pages (dir/cache.db, see
# sqlcache.py — one table per endpoint kind, plus a cache_ai table for AI
# summaries; WAL mode, so dir/cache.db-wal and dir/cache.db-shm sidecar
# files will also appear there — that's normal, not corruption).
# Leave dir empty (the default) to disable persistent caching entirely.
# dir: absolute or relative path to the cache directory. Also gates the AI
#      summary cache (dir/cache.db, cache_ai table) and the free-text search
#      index over epicrisis/imaging report text (dir/search_index.db, see
#      search_index.py) — both piggyback on this same setting, with no
#      config keys of their own.
# ttl: time-to-live for individual cache entries in seconds (default: 7 days)
# max_age_days: hard upper bound on cache entry age in days; entries older
#               than this are deleted during cleanup even if not yet expired
#               (0 = no hard limit; default: 30). Also used as the search
#               index's document retention window.
dir =
ttl = 604800
max_age_days = 30

[logging]
# File logging is off by default (file empty). Console logging always runs
# independently of this section (see --log-level / $LOG_LEVEL).
# file: path to a log file; parent directories are created if needed.
#       Always captures at DEBUG level regardless of the console's level.
# max_bytes: rotate the log file once it reaches this size (default: 10 MiB)
# backup_count: number of rotated backups to keep (default: 5)
file =
max_bytes = 10485760
backup_count = 5

[radiology]
# Comma-separated list of HippoBridge usernames allowed to write radiology reports.
# e.g. allowed_radiologists = dr.popescu, dr.ionescu
allowed_radiologists =

# The /api/ai/extract endpoint's server URL and per-tier model names are
# configured in llm.cfg (separate file) — not here.
