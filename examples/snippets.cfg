# Report-editor snippets: type ";name" then Tab in the report textarea to expand.
# Copy to the project root and edit (gitignored there; this copy is the reference):
#   cp examples/snippets.cfg snippets.cfg
# One section per modality (radiography, ultrasound, ct, mri, fluoroscopy), so
# the same ";abd" can expand differently in each; [common] applies to all and
# is overridden by a modality's own snippet of the same name.
# Format: name = text. A newline is written either as a literal \n or as an
# indented continuation line. "$0" marks where the
# cursor lands (optional; the first one only). Names are case-insensitive.
# The file is re-read on change, no restart needed.

[common]

[ultrasound]
# Limitări
bed = Ecografie efectuată la patul pacientului, cu valoare diagnostică limitată.
necoop = Pacient greu cooperant, examinare cu valoare diagnostică limitată.
supra = Pacient supraponderal, examinare cu valoare diagnostică limitată.

# Abdomen normal / neonatal / genital
abd = Ficat omogen, normoecogen, dimensiuni în limite normale. Căi biliare intra și extra hepatice nedilatate.
  Colecist cu dimensiuni și morfologie normale, conținut transsonic, fără calculi, perete subțire.
  Ambii rinichi în poziție normală, dimensiuni corespunzătoare vârstei, fără dilatații pielocaliceale, fără calculi. Uretere nevizualizabile, fără semne de dilatație ureterală.
  Pancreas omogen, normoecogen, dimensiuni normale. Fără dilatații ductale.
  Splină omogenă, normoecogenă, dimensiuni normale.
  Vezică urinară în repleție, conținut transsonic, perete subțire.
  Apendice nevizualizabil.
  Fără lichid liber intraperitoneal.
abdn = Ficat omogen, normoecogen, cu dimensiuni în limite normale. Căi biliare intra și extra hepatice nedilatate.
  Colecist cu dimensiuni și morfologie normale, conținut transsonic, fără calculi, perete subțire.
  Ambii rinichi în poziție normală, dimensiuni corespunzătoare vârstei, parenchim cu aspect fetal, fără dilatații pielocaliceale. Uretere nevizualizabile, fără semne de dilatație ureterală.
  Pancreas omogen, normoecogen, dimensiuni normale. Fără dilatații ductale.
  Splină omogenă, normoecogenă, dimensiuni normale.
  Vezică urinară în semirepleție, conținut transsonic, perete subțire.
  Pilor permeabil, fără hipertrofie a muscularei.
  Fără lichid liber intraperitoneal.
pelvis = Uter în anteversoflexie, cu dimensiuni și ecostructură normale. Ovare în poziție normală, cu dimensiuni și structură foliculară normale.

# Abdomen patologic
apendice = Apendice cu diametrul de $0 mm, perete gros, conținut transsonic, sensibil la pasajul sondei, necompresibil, asociind modificări inflamatorii ale țesuturilor moi adiacente.
lichid = Lichid intraperitoneal $0 mm vizibil în recesul recto-vezical.
intdest = Intestin destins, hiperperistaltic, cu conținut fluid mixt.
ileus = Intestin destins, hipoperistaltic, cu conținut fluid.
limfmez = Limfadenită mezenterică periombilicală, cu caracter reactiv.

# ETF
etf = Emisfere cerebrale simetrice. Fără modificări decelabile ecografic la nivelul parenchimului cerebral explorat.
  Ventriculi laterali simetrici, cu dimensiuni în limite normale și formă păstrată. Ventricul III cu diametru normal. Ventricul IV vizibil, cu aspect normal. Plexuri coroidiene neremarcabile.
  Structuri ale liniei mediane nedeplasate. Corp calos prezent, cu aspect normal. Cisterna magna în limite normale.
  Spații pericerebrale normale fronto-parietal.

# Scrot
scrot = Ambele testicule prezente în scrot, având dimensiuni și ecostructură în limite normale.
  Epididim normal.
  Fără dilatații venoase varicoase.
  Fără lichid peritesticular semnificativ.

# Pleură
pleura = Pulmon drept cu ecogenitate parenchimatoasă normală, dinamică diafragmatică normală, alunecare pulmonară prezentă.
pleurp = Consolidare pulmonară stângă (linii "B", aspect interstițial), dinamică redusă, asociind importantă cantitate de lichid pleural ($0 mm), aproximativ 3/4 din volumul hemitoracelui, cu aspect transsonic.

# Traumă
trauma = Fără leziuni posttraumatice ale organelor parenchimatoase abdominale decelabile ecografic în momentul examinării.
  Ficat omogen, normoecogen, dimensiuni în limite normale. Căi biliare intra și extra hepatice nedilatate.
  Colecist cu dimensiuni și morfologie normale, conținut transsonic, nelitiazic, perete subțire.
  Ambii rinichi în poziție normală, cu ecostructură normală, dimensiuni corespunzătoare vârstei, fără dilatații pielocaliceale, fără calculi. Uretere nevizualizabile.
  Pancreas omogen, normoecogen, dimensiuni normale. Fără dilatații ductale. Fără colecții peripancreatice.
  Splină omogenă, normoecogenă, dimensiuni normale.
  Vezică urinară în repleție, conținut transsonic, perete subțire.
  Recesuri peritoneale libere.

# Transplant
transplant = Grefon hepatic normoecogen, cu ecostructură normală, fără dilatații ale căilor biliare.
  Arteră hepatică în hil cu flux prezent, RI $0. Venă portă în hil 10 mm, cu flux hepatopet, cu variații respiratorii.
  Vene suprahepatice, venă cavă inferioară cu flux normal.
  Lichid liber intraperitoneal 5 mm în recesul Douglas.

# Cervical
limfcerv = Limfadenită laterocervicală bilaterală cu caracter reactiv, limfonoduli cu diametrul de $0 mm, cu ecogenitate redusă, având tendință la abcedare. Asociază modificări inflamatorii de vecinătate.
parotida = Moderată creștere a dimensiunilor și accentuare a ecogenității glandei parotide, cu dilatații ductale transsonice, cu diametrul de 1-2 mm, asociind limfadenită intraparotidiană și regională, aspect sugestiv pentru parotidită acută.
  Aspect neremarcabil al glandei parotide controlaterale.

[radiography]
# Torace
torace = Fără procese de consolidare pulmonară.
  Fără pneumotorax.
  Fără revărsat pleural.
  Siluetă cardio-mediastinală în limite normale.
  Structuri osoase și țesuturi moi toracice fără aspecte notabile.
infalv = Infiltrat alveolar peri și infrahilar bilateral.
  Fără revărsat pleural.
  Siluetă cardio-mediastinală în limite normale.
infint = Infiltrat interstițial peribronhovascular peri și infrahilar bilateral.
  Fără revărsat pleural.
  Siluetă cardio-mediastinală în limite normale.
infreticul = Infiltrat interstițial reticulomicronodular peri și infrahilar bilateral.
  Fără revărsat pleural.
  Siluetă cardio-mediastinală în limite normale.
micronod = Multiple opacități micronodulare confluente, cu caracter alveolar, diseminate peri și infrahilar bilateral. Bronhogramă aerică prezentă.
  Fără revărsat pleural.
  Siluetă cardio-mediastinală în limite normale.
pneumlm = Proces alveolar cu tendință la sistematizare, intensitate costală, proiectat paracardiac dreapta, ștergând conturul cordului, aspect sugestiv pentru pneumonie lobară medie.
  Fără revărsat pleural.
opacitate = Opacitate sistematizată, de intensitate costală, neomogenă prin prezența bronhogramei aerice, proiectată paracardiac dreapta, ștergând conturul arcului inferior (lob mediu).
  Fără revărsat pleural.

# Sistem osos și traumatologie
craniu = Fără leziuni craniene posttraumatice evidente în radiografiile efectuate.
toracoss = Fără leziuni osoase toracice post-traumatice evidente în incidența efectuată.
fractp = Fără fracturi vizibile în incidențele efectuate.
fract = Fără fracturi evidente în incidența efectuată.
coloana = Fără modificări de aliniere vertebrală. Fără fracturi vizibile în incidențele efectuate.
  Dextroscolioză toraco-lombară ușoară.
femur = Fractură mediofemurală stângă redusă și fixată cu materiale de osteosinteză.

# Abdomen și pelvis
abd = Fără niveluri hidroaerice. Fără pneumoperitoneu.
  Fără modificări vizibile în bazele pulmonare.
  Structuri osoase și țesuturi moi fără aspecte notabile.
calculi = Fără imagini de calculi radioopaci identificabile în ariile reno-ureterale în radiografia efectuată.
distensie = Importantă distensie colonică/gastrică cu ascensiunea hemidiafragmului stâng.
  Mediastin neremarcabil.
corpstrain = Fără imagini de corpi străini radioopaci în radiografia efectuată.

# Cap, gât, sinusuri
sinusuri = Transparență normală a sinusurilor paranazale.
prevert = Fără modificări ale țesuturilor moi prevertebrale vizibile în incidența efectuată.
orl = Aspect neremarcabil al foselor nazale, faringelui, laringelui și traheei cervicale în incidențele efectuate.
  Spațiu retrofaringian normal.
  Fără imagini de corpi străini radioopaci.

