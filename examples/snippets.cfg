# Report-editor snippets: type ";name" then Tab in the report textarea to expand.
# Copy to the project root and edit (gitignored there; this copy is the reference):
#   cp examples/snippets.cfg snippets.cfg
# One section per modality (radiography, ultrasound, ct, mri, fluoroscopy), so
# the same ";abd" can expand differently in each; [common] applies to all and
# is overridden by a modality's own snippet of the same name.
# Format: name = text. A newline is written either as a literal \n or as an
# indented continuation line. "$0" marks where the
# cursor lands (optional; the first one only). Names are case-insensitive.
# The file is re-read on change, no restart needed.

[common]

[ultrasound]
apendice = Apendice cu diametrul de $0 mm, perete gros, conținut transsonic, sensibil la pasajul sondei, necompresibil, asociind modificări inflamatorii ale țesuturilor moi adiacente.

